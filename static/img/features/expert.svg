<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Instructor explaining a Kubernetes cluster, with an AI assistant">
  <defs>
    <linearGradient id="ex-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="ex-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="ex-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="ex-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e3a8a" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="360" height="220" rx="18" fill="url(#ex-bg)"/>
  <circle cx="320" cy="30" r="46" fill="#c7d2fe" opacity="0.55"/>
  <circle cx="34" cy="196" r="34" fill="#ddd6fe" opacity="0.7"/>
  <!-- board -->
  <g filter="url(#ex-shadow)">
    <rect x="120" y="34" width="206" height="132" rx="12" fill="#fff"/>
  </g>
  <rect x="120" y="34" width="206" height="22" rx="12" fill="#1e3a8a"/>
  <rect x="120" y="46" width="206" height="10" fill="#1e3a8a"/>
  <circle cx="134" cy="45" r="3.5" fill="#f87171"/><circle cx="146" cy="45" r="3.5" fill="#fbbf24"/><circle cx="158" cy="45" r="3.5" fill="#34d399"/>
  <!-- cluster diagram on the board -->
  <rect x="190" y="68" width="66" height="26" rx="7" fill="url(#ex-blue)"/>
  <text x="223" y="85" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">control plane</text>
  <g stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <path d="M223 94 V108 H160 V118"/><path d="M223 94 V118"/><path d="M223 94 V108 H286 V118"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <rect x="134" y="118" width="52" height="34" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <rect x="197" y="118" width="52" height="34" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <rect x="260" y="118" width="52" height="34" rx="7" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="160" y="131">node01</text><text x="223" y="131">node02</text><text x="286" y="131">node03</text>
  </g>
  <g fill="#3b82f6"><rect x="142" y="137" width="10" height="8" rx="2"/><rect x="155" y="137" width="10" height="8" rx="2"/><rect x="205" y="137" width="10" height="8" rx="2"/><rect x="268" y="137" width="10" height="8" rx="2"/><rect x="281" y="137" width="10" height="8" rx="2"/><rect x="294" y="137" width="10" height="8" rx="2" fill="#7c3aed"/></g>
  <!-- instructor -->
  <path d="M30 206c0-34 18-56 44-56s44 22 44 56z" fill="url(#ex-blue)"/>
  <circle cx="74" cy="118" r="22" fill="#fcd9b6"/>
  <path d="M52 114c0-16 10-26 23-26 14 0 24 10 23 24-6-7-14-10-23-10-9 0-17 4-23 12z" fill="#1f2937"/>
  <path d="M104 166 L136 120" stroke="#1e40af" stroke-width="9" stroke-linecap="round"/>
  <circle cx="138" cy="117" r="6" fill="#fcd9b6"/>
  <!-- AI bubble -->
  <g filter="url(#ex-shadow)">
    <rect x="18" y="26" width="92" height="50" rx="14" fill="url(#ex-violet)"/>
    <path d="M60 76 L70 76 L58 90 z" fill="#7c3aed"/>
  </g>
  <path d="M42 51l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/>
  <rect x="58" y="44" width="40" height="5" rx="2.5" fill="#ede9fe"/>
  <rect x="58" y="54" width="30" height="5" rx="2.5" fill="#ede9fe" opacity="0.8"/>
  <rect x="58" y="64" width="35" height="5" rx="2.5" fill="#ede9fe" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Certificate with a seal and the KCNA, CKA, CKAD and CKS badges">
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef9c3" stop-opacity="0.55"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="ce-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="ce-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="ce-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="ce-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e3a8a" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="360" height="220" rx="18" fill="url(#ce-bg)"/>
  <circle cx="330" cy="36" r="42" fill="#fde68a" opacity="0.45"/>
  <circle cx="26" cy="190" r="38" fill="#c7d2fe" opacity="0.6"/>
  <!-- certificate -->
  <g filter="url(#ce-shadow)" transform="rotate(-4 150 112)">
    <rect x="58" y="40" width="190" height="132" rx="10" fill="#fff"/>
    <rect x="66" y="48" width="174" height="116" rx="6" fill="none" stroke="#c7d2fe" stroke-width="2"/>
    <text x="153" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">CERTIFICATE</text>
    <rect x="103" y="84" width="100" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="88" y="98" width="130" height="7" rx="3.5" fill="url(#ce-blue)"/>
    <rect x="98" y="113" width="110" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="108" y="122" width="90" height="4" rx="2" fill="#e2e8f0"/>
    <path d="M86 150 q10 -10 20 0 t20 0" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <rect x="80" y="154" width="54" height="1.5" fill="#94a3b8"/>
  </g>
  <!-- seal -->
  <g filter="url(#ce-shadow)">
    <path d="M222 150 l-10 40 14 -8 8 14 6 -42z" fill="#7c3aed"/>
    <path d="M246 150 l10 40 -14 -8 -8 14 -6 -42z" fill="#6d28d9"/>
    <circle cx="234" cy="140" r="26" fill="url(#ce-gold)"/>
  </g>
  <circle cx="234" cy="140" r="19" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M225 140 l6 6 12 -13" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- badges -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">
    <g filter="url(#ce-shadow)"><rect x="268" y="40" width="68" height="24" rx="12" fill="url(#ce-violet)"/></g><text x="302" y="56">KCNA</text>
    <g filter="url(#ce-shadow)"><rect x="276" y="72" width="68" height="24" rx="12" fill="url(#ce-gold)"/></g><text x="310" y="88">CKA</text>
    <g filter="url(#ce-shadow)"><rect x="268" y="104" width="68" height="24" rx="12" fill="url(#ce-blue)"/></g><text x="302" y="120">CKAD</text>
    <g filter="url(#ce-shadow)"><rect x="284" y="136" width="56" height="24" rx="12" fill="#0f172a"/></g><text x="312" y="152">CKS</text>
  </g>
  <path d="M30 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f59e0b" opacity="0.8"/>
  <path d="M262 182l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#7c3aed" opacity="0.7"/>
</svg>

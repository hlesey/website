<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Terminal running kubectl next to an AI agent panel and a cluster">
  <defs>
    <linearGradient id="ho-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="ho-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="ho-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <filter id="ho-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="360" height="220" rx="18" fill="url(#ho-bg)"/>
  <circle cx="40" cy="30" r="40" fill="#bae6fd" opacity="0.5"/>
  <circle cx="330" cy="200" r="44" fill="#c7d2fe" opacity="0.6"/>
  <!-- terminal -->
  <g filter="url(#ho-shadow)"><rect x="22" y="36" width="196" height="150" rx="12" fill="#0f172a"/></g>
  <rect x="22" y="36" width="196" height="22" rx="12" fill="#1e293b"/>
  <rect x="22" y="48" width="196" height="10" fill="#1e293b"/>
  <circle cx="36" cy="47" r="3.5" fill="#f87171"/><circle cx="48" cy="47" r="3.5" fill="#fbbf24"/><circle cx="60" cy="47" r="3.5" fill="#34d399"/>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
    <text x="34" y="78" fill="#60a5fa">$ <tspan fill="#e2e8f0">kubectl get pods -n shop</tspan></text>
    <text x="34" y="96" fill="#94a3b8">NAME          READY  STATUS</text>
    <text x="34" y="111" fill="#e2e8f0">api-7d9f      1/1    <tspan fill="#34d399">Running</tspan></text>
    <text x="34" y="126" fill="#e2e8f0">web-5c2b      1/1    <tspan fill="#34d399">Running</tspan></text>
    <text x="34" y="141" fill="#e2e8f0">db-0          0/1    <tspan fill="#f87171">CrashLoop</tspan></text>
    <text x="34" y="163" fill="#60a5fa">$ <tspan fill="#e2e8f0">kubectl logs db-0</tspan></text>
  </g>
  <rect x="148" y="155" width="7" height="11" fill="#e2e8f0" opacity="0.8"/>
  <!-- agent panel -->
  <g filter="url(#ho-shadow)"><rect x="196" y="20" width="144" height="118" rx="14" fill="#fff"/></g>
  <circle cx="216" cy="40" r="11" fill="url(#ho-violet)"/>
  <path d="M216 33l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>
  <text x="233" y="44" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e1b4b">AI agent</text>
  <rect x="294" y="34" width="36" height="14" rx="7" fill="#fef3c7"/>
  <text x="312" y="44" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">read-only</text>
  <rect x="206" y="58" width="118" height="22" rx="8" fill="#ede9fe"/>
  <rect x="214" y="65" width="90" height="4" rx="2" fill="#7c3aed" opacity="0.6"/><rect x="214" y="72" width="64" height="4" rx="2" fill="#7c3aed" opacity="0.4"/>
  <rect x="222" y="86" width="108" height="22" rx="8" fill="#dbeafe"/>
  <rect x="230" y="93" width="84" height="4" rx="2" fill="#1e40af" opacity="0.55"/><rect x="230" y="100" width="58" height="4" rx="2" fill="#1e40af" opacity="0.35"/>
  <rect x="206" y="114" width="56" height="16" rx="8" fill="url(#ho-violet)"/>
  <text x="234" y="125" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Approve</text>
  <rect x="268" y="114" width="50" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="293" y="125" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Deny</text>
  <!-- cluster -->
  <g stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 4"><path d="M262 178 L292 162 L322 178"/><path d="M292 162 V150"/></g>
  <g fill="url(#ho-blue)">
    <path d="M292 136 l13 7.5 v15 l-13 7.5 -13 -7.5 v-15z"/>
    <path d="M262 168 l11 6.5 v13 l-11 6.5 -11 -6.5 v-13z"/>
    <path d="M322 168 l11 6.5 v13 l-11 6.5 -11 -6.5 v-13z"/>
  </g>
  <circle cx="292" cy="151" r="4" fill="#fff"/>
</svg>
